<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Disney Cruise Stateroom Availability</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 1.5rem; background: #0b1f3a; color: #f0f4f8;
  }
  h1 { font-size: 1.4rem; margin: 0 0 .25rem; }
  .sub { color: #9fb3c8; font-size: .85rem; margin-bottom: 1rem; }
  .bar { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.25rem; }
  button {
    background: #1d6fd6; color: #fff; border: 0; border-radius: 8px;
    padding: .6rem 1.2rem; font-size: .95rem; cursor: pointer; font-weight: 600;
  }
  button:disabled { opacity: .5; cursor: progress; }
  .grid { display: grid; gap: 1rem; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .card { background: #13294b; border: 1px solid #244167; border-radius: 12px; padding: 1rem 1.1rem; }
  .card h2 { margin: 0; font-size: 1.1rem; }
  .dates { color: #9fb3c8; font-size: .85rem; margin: .15rem 0 .6rem; }
  .total { font-size: 1.6rem; font-weight: 700; color: #6fd0a0; }
  .total span { font-size: .8rem; font-weight: 400; color: #9fb3c8; }
  table { width: 100%; border-collapse: collapse; margin-top: .7rem; font-size: .85rem; }
  th, td { text-align: left; padding: .35rem .3rem; border-bottom: 1px solid #244167; }
  th { color: #9fb3c8; font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .sub-row td:first-child { padding-left: 1.2rem; color: #9fb3c8; }
  .type-row td { font-weight: 600; }
  .err { color: #ff8f8f; }
</style>
</head>
<body>
  <h1>Disney Cruise Stateroom Availability</h1>
  <div class="sub" id="meta">Loading&hellip;</div>
  <div class="bar">
    <button id="refresh">Refresh</button>
    <span class="sub" id="status"></span>
  </div>
  <div class="grid" id="grid"></div>

<script>
const PRICE = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const pretty = (s) => (s || "").replace(/^DD-/, "").replace(/-/g, " ").toLowerCase()
  .replace(/\b\w/g, (c) => c.toUpperCase());

function renderVoyage(v) {
  if (v.error) {
    return `<div class="card"><h2>${v.voyageId}</h2><p class="err">Error: ${v.error}</p></div>`;
  }
  let rows = "";
  for (const t of v.stateroomTypes) {
    rows += `<tr class="type-row"><td>${pretty(t.type)}</td>` +
      `<td class="num">${t.count}</td>` +
      `<td class="num">${t.startingPrice != null ? "from " + PRICE.format(t.startingPrice) : "&mdash;"}</td></tr>`;
    for (const s of t.subtypes) {
      rows += `<tr class="sub-row"><td>${s.category || ""} &middot; ${pretty(s.name).replace(pretty(t.type), "").trim()}</td>` +
        `<td class="num">${s.count}</td>` +
        `<td class="num">${s.startingPrice != null ? PRICE.format(s.startingPrice) : "&mdash;"}</td></tr>`;
    }
  }
  return `<div class="card">
    <h2>${v.voyageId} <small>(${v.packageCode || ""})</small></h2>
    <div class="dates">${v.startDate || "?"} &rarr; ${v.endDate || "?"}</div>
    <div class="total">${v.totalAvailable}<span> staterooms available</span></div>
    <table><thead><tr><th>Category</th><th class="num">Count</th><th class="num">Price (2 guests)</th></tr></thead>
    <tbody>${rows}</tbody></table>
  </div>`;
}

async function load() {
  const btn = document.getElementById("refresh");
  const status = document.getElementById("status");
  btn.disabled = true;
  status.textContent = "Loading data…";
  try {
    const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    document.getElementById("grid").innerHTML = data.voyages.map(renderVoyage).join("");
    const when = new Date(data.generatedAt);
    document.getElementById("meta").textContent =
      "Data collected " + when.toLocaleString() + " · party of 2 adults";
    status.textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) {
    status.textContent = "Failed to load data.json: " + e.message;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("refresh").addEventListener("click", load);
load();
</script>
</body>
</html>
