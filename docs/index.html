<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Disney Cruise — Rooms Available on All 3 Sailings</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0; padding: 1.5rem; background: #0b1f3a; color: #f0f4f8;
  }
  h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
  .sub { color: #9fb3c8; font-size: .85rem; }
  .voyages { margin: .4rem 0 1rem; font-size: .82rem; color: #9fb3c8; }
  .voyages b { color: #cfe0f0; }
  .bar { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; margin-bottom: 1rem; }
  button {
    background: #1d6fd6; color: #fff; border: 0; border-radius: 8px;
    padding: .55rem 1rem; font-size: .9rem; cursor: pointer; font-weight: 600;
  }
  button.alt { background: #244167; }
  button.alt.active { background: #2f7d57; }
  button:disabled { opacity: .5; cursor: progress; }
  #status { color: #9fb3c8; font-size: .82rem; }
  .wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: .85rem; }
  th, td { padding: .45rem .55rem; border-bottom: 1px solid #244167; text-align: left; white-space: nowrap; }
  thead th { color: #9fb3c8; cursor: pointer; user-select: none; }
  thead th.sorted { color: #6fd0a0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.total { font-weight: 700; color: #6fd0a0; }
  tbody tr:hover { background: #13294b; }
  .empty { color: #ff8f8f; padding: 1rem 0; }
</style>
</head>
<body>
  <h1>Staterooms available on all 3 sailings</h1>
  <div class="sub" id="meta">Loading&hellip;</div>
  <div class="voyages" id="voyages"></div>
  <div class="bar">
    <button id="refresh">Refresh</button>
    <button class="alt" data-sort="deck">Sort by Floor</button>
    <button class="alt" data-sort="type">Sort by Room Type</button>
    <span id="status"></span>
  </div>
  <div class="wrap"><table id="tbl">
    <thead><tr id="head"></tr></thead>
    <tbody id="body"></tbody>
  </table></div>
  <div class="empty" id="empty" hidden></div>

<script>
const PRICE = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 });
const pretty = (s) => (s || "").replace(/^DD-/, "").replace(/-/g, " ").toLowerCase()
  .replace(/\b\w/g, (c) => c.toUpperCase());

let state = { rooms: [], voyageOrder: [], sortKey: "deck", sortDir: 1 };

function columns() {
  const cols = [
    { key: "stateroomId", label: "Room #" },
    { key: "deck", label: "Floor", num: true },
    { key: "type", label: "Room Type", fmt: pretty },
    { key: "category", label: "Category" },
    { key: "location", label: "Location", fmt: pretty },
  ];
  for (const v of state.voyageOrder) {
    cols.push({ key: "price:" + v, label: v, num: true, price: true });
  }
  cols.push({ key: "total", label: "Total (all 3)", num: true, price: true, total: true });
  return cols;
}

function valueOf(room, key) {
  if (key.startsWith("price:")) return room.prices[key.slice(6)];
  return room[key];
}

function sortRooms() {
  const k = state.sortKey, d = state.sortDir;
  state.rooms.sort((a, b) => {
    let av = valueOf(a, k), bv = valueOf(b, k);
    if (av == null) av = d > 0 ? Infinity : -Infinity;
    if (bv == null) bv = d > 0 ? Infinity : -Infinity;
    if (av < bv) return -d;
    if (av > bv) return d;
    // tie-breakers: floor then room number
    return (a.deck - b.deck) || String(a.stateroomId).localeCompare(String(b.stateroomId));
  });
}

function render() {
  const cols = columns();
  document.getElementById("head").innerHTML = cols.map((c) =>
    `<th data-key="${c.key}" class="${c.key === state.sortKey ? "sorted" : ""}">${c.label}` +
    `${c.key === state.sortKey ? (state.sortDir > 0 ? " ▲" : " ▼") : ""}</th>`).join("");

  sortRooms();
  document.getElementById("body").innerHTML = state.rooms.map((r) =>
    "<tr>" + cols.map((c) => {
      const v = valueOf(r, c.key);
      let text = v == null ? "—" : c.price ? PRICE.format(v) : c.fmt ? c.fmt(v) : v;
      return `<td class="${c.num ? "num" : ""} ${c.total ? "total" : ""}">${text}</td>`;
    }).join("") + "</tr>").join("");

  document.querySelectorAll("th[data-key]").forEach((th) => {
    th.onclick = () => {
      const k = th.dataset.key;
      if (state.sortKey === k) state.sortDir *= -1;
      else { state.sortKey = k; state.sortDir = 1; }
      syncButtons();
      render();
    };
  });

  const empty = document.getElementById("empty");
  if (state.rooms.length === 0) {
    empty.hidden = false;
    empty.textContent = "No staterooms are currently available on all 3 sailings.";
  } else {
    empty.hidden = true;
  }
}

function syncButtons() {
  document.querySelectorAll("button.alt").forEach((b) =>
    b.classList.toggle("active", b.dataset.sort === state.sortKey));
}

async function load() {
  const btn = document.getElementById("refresh");
  const status = document.getElementById("status");
  btn.disabled = true;
  status.textContent = "Loading…";
  try {
    const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    state.rooms = data.rooms || [];
    state.voyageOrder = data.voyageOrder || [];

    const when = new Date(data.generatedAt);
    document.getElementById("meta").textContent =
      `${state.rooms.length} room(s) available on all 3 sailings · prices for 2 adults · data collected ${when.toLocaleString()}`;
    document.getElementById("voyages").innerHTML = (data.voyages || []).map((v) =>
      `<b>${v.voyageId}</b> ${v.startDate || "?"}→${v.endDate || "?"}`).join(" &nbsp;·&nbsp; ");

    render();
    status.textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (e) {
    status.textContent = "Failed to load data.json: " + e.message;
  } finally {
    btn.disabled = false;
  }
}

document.getElementById("refresh").addEventListener("click", load);
document.querySelectorAll("button.alt").forEach((b) =>
  b.addEventListener("click", () => {
    state.sortKey = b.dataset.sort;
    state.sortDir = 1;
    syncButtons();
    render();
  }));

syncButtons();
load();
</script>
</body>
</html>
